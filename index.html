<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamil Islamic Voice</title>
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Islamic Theme Colors: Green, Gold, White */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a2f1f 0%, #1a4a2e 50%, #0a2f1f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
      position: relative;
    }

    /* Islamic Geometric Pattern Overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.05"><path d="M50 0 L100 50 L50 100 L0 50 Z" fill="none" stroke="%23c9a84c" stroke-width="1"/><path d="M50 10 L90 50 L50 90 L10 50 Z" fill="none" stroke="%23c9a84c" stroke-width="1"/><path d="M50 20 L80 50 L50 80 L20 50 Z" fill="none" stroke="%23c9a84c" stroke-width="1"/><circle cx="50" cy="50" r="15" fill="none" stroke="%23c9a84c" stroke-width="1"/><circle cx="50" cy="50" r="25" fill="none" stroke="%23c9a84c" stroke-width="0.5"/></svg>');
      background-repeat: repeat;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 750px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 35px 30px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(201, 168, 76, 0.3);
      border: 1px solid rgba(201, 168, 76, 0.2);
      position: relative;
      z-index: 1;
      text-align: center;
    }

    /* Logo & Title */
    .logo-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .islamic-logo {
      font-size: 3.5rem;
      color: #c9a84c;
      background: rgba(0, 0, 0, 0.3);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #c9a84c;
      box-shadow: 0 0 25px rgba(201, 168, 76, 0.3);
    }

    .station-name {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 2px 15px rgba(0,0,0,0.5);
      background: linear-gradient(to right, #f5e7b0, #c9a84c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .station-name-sub {
      font-size: 0.9rem;
      color: #d4c08a;
      letter-spacing: 4px;
      margin-top: -8px;
      font-weight: 300;
    }

    /* Player Card */
    .player-card {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 30px;
      padding: 25px 20px;
      margin: 25px 0;
      border: 1px solid rgba(201, 168, 76, 0.2);
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.3);
    }

    .now-playing {
      font-size: 1rem;
      color: #c9a84c;
      letter-spacing: 2px;
      margin-bottom: 12px;
      font-weight: 300;
    }

    .audio-wrapper {
      background: #0d1f14;
      border-radius: 60px;
      padding: 5px 5px 5px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #c9a84c;
      box-shadow: 0 0 20px rgba(201, 168, 76, 0.2);
    }

    audio {
      width: 100%;
      height: 50px;
      outline: none;
      background: transparent;
      border: none;
    }

    audio::-webkit-media-controls-panel {
      background: transparent;
    }

    audio::-webkit-media-controls-play-button {
      background-color: #c9a84c;
      border-radius: 50%;
      color: #0a2f1f;
    }

    audio::-webkit-media-controls-current-time-display,
    audio::-webkit-media-controls-time-remaining-display {
      color: #fff;
    }

    .live-badge {
      background: #c0392b;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      text-transform: uppercase;
      animation: pulse 1.8s infinite;
      margin-left: 10px;
      white-space: nowrap;
      border: 1px solid #e74c3c;
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.6; transform: scale(0.95); }
    }

    /* Contact & Social */
    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin: 25px 0 15px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px 18px;
      border-radius: 60px;
      border: 1px solid rgba(201, 168, 76, 0.15);
      transition: 0.3s;
      backdrop-filter: blur(5px);
    }

    .contact-item:hover {
      background: rgba(201, 168, 76, 0.15);
      border-color: #c9a84c;
      transform: translateY(-2px);
    }

    .contact-item i {
      font-size: 1.5rem;
      color: #c9a84c;
      width: 35px;
      text-align: center;
    }

    .contact-item a {
      color: #f0e6d3;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 400;
      word-break: break-all;
      transition: 0.2s;
    }

    .contact-item a:hover {
      color: #c9a84c;
    }

    .islamic-footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #a08b5e;
      border-top: 1px solid rgba(201, 168, 76, 0.2);
      padding-top: 20px;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .islamic-footer i {
      color: #c9a84c;
      margin: 0 5px;
    }

    .islamic-footer span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container { padding: 25px 15px; }
      .station-name { font-size: 1.8rem; }
      .islamic-logo { width: 65px; height: 65px; font-size: 2.8rem; }
      .audio-wrapper { flex-wrap: wrap; justify-content: center; padding: 10px; }
      .live-badge { margin: 5px 0 0 0; }
      .contact-item { padding: 10px 12px; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Islamic Logo & Station Name -->
  <div class="logo-wrapper">
    <div class="islamic-logo">
      <i class="fas fa-mosque"></i>
    </div>
    <div>
      <div class="station-name">Tamil Islamic Voice</div>
      <div class="station-name-sub">﷽ •  இஸ்லாமிய ஒலி</div>
    </div>
  </div>

  <!-- Player Section - Auto plays on load -->
  <div class="player-card">
    <div class="now-playing">
      <i class="fas fa-headphones" style="margin-right: 10px;"></i> நேரடி ஒலிபரப்பு
    </div>
    <div class="audio-wrapper">
      <audio id="radioPlayer" controls autoplay>
        <source src="https://stream.zeno.fm/v6mwdn1kcd0uv" type="audio/mpeg">
        உங்கள் உலாவி ஆடியோவை ஆதரிக்கவில்லை.
      </audio>
      <span class="live-badge"><i class="fas fa-circle" style="color: #ff6b6b; margin-right: 6px;"></i> LIVE</span>
    </div>
    <p style="font-size: 0.75rem; color: #9aab8a; margin-top: 12px; letter-spacing: 1px;">
      <i class="fas fa-volume-up" style="color: #c9a84c;"></i> பக்கம் திறந்தவுடன் ஒலிபரப்பு தானாக தொடங்கும்
    </p>
  </div>

  <!-- Contact Details -->
  <div class="contact-info">
    <div class="contact-item">
      <i class="fab fa-whatsapp"></i>
      <a href="https://wa.me/94757374750" target="_blank">+94 75 737 4750</a>
    </div>
    <div class="contact-item">
      <i class="fas fa-envelope"></i>
      <a href="mailto:tamilislamicvoice@gmail.com">tamilislamicvoice@gmail.com</a>
    </div>
  </div>

  <!-- Islamic Footer Decor -->
  <div class="islamic-footer">
    <span><i class="fas fa-star-and-crescent"></i>  இஸ்லாமிய குரல் </span>
    <span><i class="fas fa-moon"></i>  அமைதி &amp;  ஞானம் </span>
    <span><i class="fas fa-hands-praying"></i>  துவா </span>
  </div>

</div>

<!-- JavaScript to ensure autoplay and handle any errors gracefully -->
<script>
  (function() {
    const audio = document.getElementById('radioPlayer');

    // Attempt to play on load (autoplay attribute already does this, but for extra safety)
    audio.play().catch(error => {
      // If autoplay is blocked, show a small message but still allow manual play.
      console.log('Autoplay was prevented. User can click play.');
      // You can optionally display a subtle notification here if needed.
    });

    // If the stream fails or ends, try to reload after a short delay (for stability)
    audio.addEventListener('error', function(e) {
      console.warn('Stream error, attempting to reload...');
      setTimeout(() => {
        audio.load();
        audio.play().catch(() => {});
      }, 3000);
    });

    // When the stream is playing, ensure the UI reflects LIVE status
    audio.addEventListener('playing', function() {
      console.log('Tamil Islamic Voice is now streaming.');
    });

  })();
</script>

</body>
</html>
